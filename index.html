<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة مشرف السائقين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* layout: one-screen phone app, summary first, bottom tabs; tokens carried over from Dalil */
:root{
  --ink:#0B1F4D; --ink-soft:#5B6B8C; --ink-faint:#93A1BE;
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EAF0FA; --line:#DCE4F2;
  --accent:#2563EB; --accent-ink:#FFFFFF;
  --ok:#0E9F6E; --warn:#C27803; --crit:#D92D20;
  --ok-bg:#E3F6EE; --warn-bg:#FDF3DC; --crit-bg:#FDE8E6;
  --font:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#EAF0FF; --ink-soft:#9DB0D8; --ink-faint:#6477A0;
    --bg:#070D1E; --surface:#0E1A38; --surface-2:#16254C; --line:#1F3160;
    --accent:#5B8DF6; --accent-ink:#07102A;
    --ok:#34D399; --warn:#FBBF24; --crit:#F87171;
    --ok-bg:#0B2E26; --warn-bg:#33270A; --crit-bg:#3A1513;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#EAF0FF; --ink-soft:#9DB0D8; --ink-faint:#6477A0;
  --bg:#070D1E; --surface:#0E1A38; --surface-2:#16254C; --line:#1F3160;
  --accent:#5B8DF6; --accent-ink:#07102A;
  --ok:#34D399; --warn:#FBBF24; --crit:#F87171;
  --ok-bg:#0B2E26; --warn-bg:#33270A; --crit-bg:#3A1513;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;font-weight:800;text-wrap:balance}
.sync{font-size:12px;color:var(--ink-faint)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar b{flex:1;text-align:center;font-weight:700;font-size:14px}
main{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav a{flex:1;text-align:center;padding:12px 1px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;border-top:3px solid transparent}
nav a.on{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-soft);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-soft)}
.bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--crit)} .bar .y{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:40px}
.datebar .btn{min-width:44px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-sm);background:var(--warn-bg);border-inline-start:4px solid var(--warn);font-size:14px}
.alert.crit{background:var(--crit-bg);border-inline-start-color:var(--crit)}
.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.next .muted{color:inherit;opacity:.85}
.next .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.stop{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.seq{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.stop.done .seq{background:var(--ok);color:#fff} .stop.ret .seq{background:var(--crit);color:#fff} .stop.post .seq{background:var(--warn);color:#fff}
.empty{text-align:center;color:var(--ink-soft);padding:18px 8px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:17px;font-weight:800}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-soft)}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:15px;font-weight:500;color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500;padding:6px 0}
.chk input{width:20px;height:20px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}.kv b{font-variant-numeric:tabular-nums}
.h-top h1{flex:1;min-width:0}.hbtn{font-size:13px;padding:8px 12px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.vbars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line)}
.vbars .c{flex:1;display:flex;flex-direction:column-reverse;min-width:0;height:100%}
.vbars .c i{display:block;width:100%}.vbars .g{background:var(--ok)}.vbars .r{background:var(--crit)}
.vlbl{display:flex;gap:3px;font-size:10px;color:var(--ink-faint)}.vlbl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px}.hbar .t{width:40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .b{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}.hbar .b i{display:block;height:100%;background:var(--crit)}.hbar b{width:34px;text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:7px 4px;border-top:1px solid var(--line);text-align:start;white-space:nowrap}.tbl th{color:var(--ink-soft);font-weight:700;font-size:12px}.tbl td.n{font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{flex:1;min-width:80px}.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pod{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}.pod img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
#printArea{display:none}
.pgrp{margin-bottom:5mm}.pgrp h4{font:700 11pt Tajawal,sans-serif;margin:0 0 2mm;color:#000}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.lab{border:1px dashed #777;border-radius:2mm;padding:2.5mm;display:flex;gap:2.5mm;align-items:center;break-inside:avoid;color:#000;font-family:Tajawal,sans-serif}
.lab .q{flex-shrink:0;width:24mm;height:24mm}.lab .q svg{width:100%;height:100%;display:block}
.lab .x{flex:1;min-width:0;font-size:9pt;line-height:1.35}.lab .x b{font-size:10.5pt;display:block}.lab .s{float:left;font-size:20pt;font-weight:800;line-height:1}
@media print{@page{size:A4;margin:8mm}html,body{height:auto;background:#fff!important}.app,.sheet-bg,.toast{display:none!important}#printArea{display:block}}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="h-top"><h1 id="title">لوحة مشرف السائقين</h1><span class="sync" id="sync">جارٍ التحميل…</span><a class="btn sm hbtn" href="#setup">الإعداد</a></div>
    <div class="datebar">
      <button class="btn sm" data-act="day" data-v="-1" aria-label="اليوم السابق">›</button>
      <b id="dateLbl"></b>
      <button class="btn sm" data-act="day" data-v="1" aria-label="اليوم التالي">‹</button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <a href="#today">اليوم</a><a href="#dispatch">التوزيع</a><a href="#cash">النقد</a><a href="#reports">التقارير</a><a href="#drivers">السائقون</a><a href="#vehicles">المركبات</a>
  </nav>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>

<script src="scan.js"></script>
<script src="config.js"></script>
<script>
/* ===== أدوات ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>s?Math.round((new Date(s+'T12:00:00')-new Date(iso(new Date())+'T12:00:00'))/864e5):null;
const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString('ar-IQ-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

/* مناطق بغداد بإحداثيات تقريبية — تُستخدم فقط لترتيب المحطات وتقدير المسافة */
const AREAS={'عويريج':[33.205,44.395],'الدورة':[33.25,44.39],'أبو دشير':[33.225,44.375],'السيدية':[33.265,44.35],'البياع':[33.275,44.33],'حي العامل':[33.285,44.31],'حي الجهاد':[33.30,44.29],'العامرية':[33.31,44.27],'الغزالية':[33.345,44.25],'المنصور':[33.315,44.345],'اليرموك':[33.30,44.34],'الحارثية':[33.31,44.365],'الكاظمية':[33.38,44.34],'الشعلة':[33.37,44.28],'الحرية':[33.355,44.32],'الكرادة':[33.30,44.42],'الجادرية':[33.275,44.385],'زيونة':[33.325,44.455],'بغداد الجديدة':[33.305,44.48],'المشتل':[33.31,44.50],'الغدير':[33.32,44.47],'البلديات':[33.335,44.49],'مدينة الصدر':[33.385,44.46],'الشعب':[33.405,44.42],'الأعظمية':[33.37,44.37],'القاهرة':[33.375,44.39],'الوزيرية':[33.355,44.385],'باب المعظم':[33.35,44.38],'الباب الشرقي':[33.325,44.415],'الشورجة':[33.335,44.40],'الزعفرانية':[33.255,44.48],'جسر ديالى':[33.225,44.52],'المدائن':[33.10,44.58],'المحمودية':[33.065,44.36],'اليوسفية':[33.07,44.24],'أبو غريب':[33.29,44.07],'التاجي':[33.52,44.26],'الحسينية':[33.47,44.45],'الطالبية':[33.375,44.43],'العبيدي':[33.36,44.52],'الكمالية':[33.33,44.53],'حي أور':[33.40,44.44],'المعامل':[33.38,44.55],'الرضوانية':[33.23,44.22]};
const DEPOT=AREAS['عويريج'];
const km=(a,b)=>{if(!a||!b)return 0;const R=6371,p=Math.PI/180,dl=(b[0]-a[0])*p,dn=(b[1]-a[1])*p,x=Math.sin(dl/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const CHECKS=['الإطارات','الزيت والماء','الفرامل','الأضواء','نظافة صندوق التحميل','الوثائق (سنوية ورخصة)'];
const REASONS=['المحل مغلق','رفض الاستلام','نقص في البضاعة','خطأ في الطلب','لا يوجد نقد','أخرى'];

/* ===== الحالة والتخزين ===== */
let KEY='',TEAM={drive_code:''},ready=false;
(function(){const h=location.hash.slice(1),ok=/^[0-9a-f]{16}$/.test(h);try{if(ok){localStorage.setItem('supKey',h);history.replaceState(null,'','#today')}KEY=localStorage.getItem('supKey')||''}catch(e){if(ok)KEY=h}})();
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+CFG.key},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
let M={company:'',drivers:[],vehicles:[],customers:[],settings:{}};
let F={logs:[]};
let curDate=iso(new Date());
const DAYS={};                       // تاريخ → بيانات اليوم
const blankDay=()=>({orders:[],att:{},checks:{},sent:{},cashIn:{}});
let D=blankDay();
const timers={},busy={},pend={},VER={};let CONFLICT=false;
function setSync(t){$('#sync').textContent=t}
async function readDoc(path){const r=await rpc('sup_doc_get',{p_code:KEY,p_path:path});if(r&&r._v!=null){VER[path]=r._v;delete r._v}return r}
function persist(path,obj){if(!ready)return;clearTimeout(timers[path]);setSync('يحفظ…');timers[path]=setTimeout(()=>flush(path,obj),500)}
async function flush(path,obj){
  if(CONFLICT)return;
  if(busy[path]){pend[path]=obj;return}
  busy[path]=true;let retry=false;
  try{
    const data=JSON.parse(JSON.stringify(obj));delete data._v;
    const r=await rpc('sup_doc_set',{p_code:KEY,p_path:path,p_data:data,p_v:VER[path]==null?null:VER[path]});
    if(r===-1)conflict();
    else if(r===-3)setSync('لم يُحفظ: بيانات هذا اليوم أكبر من الحد');
    else if(r===-2)setSync('رمز المشرف لم يعد صالحاً. افتح الرابط الجديد');
    else if(typeof r==='number'&&r>0){VER[path]=r;setSync('محفوظ')}
    else retry=true;
  }catch(e){retry=true}
  busy[path]=false;
  if(retry&&!CONFLICT){setSync('تعذّر الحفظ، سأعيد المحاولة');setTimeout(()=>persist(path,obj),5000)}
  if(pend[path]&&!CONFLICT){const o=pend[path];delete pend[path];flush(path,o)}
}
function conflict(){
  CONFLICT=true;setSync('عُدّل من جهاز آخر');
  sheet('<h3>البيانات عُدّلت من جهاز آخر</h3><div class="muted">اللوحة مفتوحة على أكثر من جهاز أو تبويب، وحُفظت نسخة أحدث هناك. لم يُحفظ تعديلك الأخير هنا حتى لا يُمحى عمل الجهاز الآخر. حدّث الصفحة ثم أعد التعديل.</div><button class="btn pri" data-act="reload">تحديث الصفحة</button>');
}
const saveM=()=>persist('app/master',M);
const saveD=()=>persist('days/'+curDate,D);
const saveF=()=>persist('app/fleet',F);
function normDay(d){d=d||blankDay();d.orders=d.orders||[];d.att=d.att||{};d.checks=d.checks||{};d.sent=d.sent||{};d.cashIn=d.cashIn||{};return d}
async function loadDay(date){
  if(!DAYS[date])DAYS[date]=normDay(await readDoc('days/'+date));
  return DAYS[date];
}
async function pull(){
  if(!ready)return;const date=curDate;
  try{
    const ups=await rpc('sup_updates_get',{p_code:KEY,p_day:date});if(date!==curDate)return;let ch=0;
    ups.forEach(u=>{const o=D.orders.find(x=>x.id===u.order_id);if(o&&o.driverId===u.driver_id&&u.at>(o.at||0)){Object.assign(o,u.data,{at:u.at});ch++}});
    if(ch){saveD();if(!$('#sheetBg').classList.contains('show'))render();toast('تحديث من السائقين: '+ch)}
  }catch(e){}
}
async function loadRange(from,to,fresh){
  const r=await rpc('sup_days_range',{p_code:KEY,p_from:from,p_to:to})||{};
  Object.keys(r).forEach(k=>{const v=r[k]._v;delete r[k]._v;if(k===curDate&&DAYS[k])return;if(!DAYS[k]||fresh){DAYS[k]=normDay(r[k]);if(v!=null)VER['days/'+k]=v}});
}
const labelCode=o=>'D1|'+curDate+'|'+o.id;
async function init(){
  render();
  if(!KEY){setSync('الرابط ناقص');$('#main').innerHTML='<div class="card"><div class="empty">افتح الرابط الكامل الذي يحتوي رمز المشرف.</div></div>';return}
  try{
    const r=await Promise.all([readDoc('app/master'),rpc('sup_list',{p_code:KEY}),readDoc('app/fleet')]);
    if(!r[1]){setSync('الرمز غير صالح');$('#main').innerHTML='<div class="card"><div class="empty">رمز المشرف غير صحيح.</div></div>';return}
    TEAM=r[1];if(r[0])M=Object.assign(M,r[0]);M.settings=M.settings||{};if(r[2])F=Object.assign({logs:[]},r[2]);
    ['drivers','vehicles','customers'].forEach(k=>M[k]=M[k]||[]);
    D=await loadDay(curDate);ready=true;setSync('محفوظ');
  }catch(e){setSync('لا يوجد اتصال');$('#main').innerHTML='<div class="card"><div class="empty">تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم حدّث الصفحة.</div></div>';return}
  render();pull();setInterval(pull,15000);
  loadRange(addDays(iso(new Date()),-6),addDays(iso(new Date()),-1)).then(()=>{if(tab()==='drivers'||tab()==='vehicles'||tab()==='today')render()}).catch(()=>{});
}

/* ===== حسابات ===== */
const drv=id=>M.drivers.find(d=>d.id===id);
const veh=id=>M.vehicles.find(v=>v.id===id);
const present=d=>D.att[d.id]!=='absent';
const ordersOf=id=>D.orders.filter(o=>o.driverId===id).sort((a,b)=>(a.seq||0)-(b.seq||0));
const load=id=>ordersOf(id).filter(o=>o.status!=='post').reduce((s,o)=>s+(+o.cartons||0),0);
const dlv=o=>o.status==='done'?(o.delivered!=null?+o.delivered:(+o.cartons||0)):0;
const due=o=>o.status==='done'?Math.round((+o.value||0)*((+o.cartons)?dlv(o)/(+o.cartons):1)):0;
const cashOf=o=>o.status==='done'?(o.cash!=null?+o.cash:due(o)):0;
const partial=o=>o.status==='done'&&dlv(o)<(+o.cartons||0);
const money=n=>(+n||0).toLocaleString('en')+' د.ع';
function cashRow(id){const os=ordersOf(id),d=os.reduce((s,o)=>s+due(o),0),c=os.reduce((s,o)=>s+cashOf(o),0),r=D.cashIn[id];return {due:d,cash:c,credit:d-c,recv:r==null?null:+r,diff:r==null?null:c-r}}
const KINDS={fuel:'وقود',oil:'تبديل زيت',maint:'صيانة',tires:'إطارات',other:'أخرى'};
function vehStats(vid,from,to){
  const L=F.logs.filter(l=>l.vid===vid&&l.date>=from&&l.date<=to),reads=L.map(l=>+l.km).filter(Boolean);
  for(let d=from;d<=to;d=addDays(d,1)){const x=DAYS[d];if(x&&x.checks&&x.checks[vid]&&x.checks[vid].km)reads.push(+x.checks[vid].km)}
  const v=veh(vid);if(v&&v.km&&to>=iso(new Date()))reads.push(+v.km);
  const kmv=reads.length>1?Math.max(...reads)-Math.min(...reads):0,FU=L.filter(l=>l.kind==='fuel');
  const fuel=FU.reduce((s,l)=>s+(+l.amount||0),0),lit=FU.reduce((s,l)=>s+(+l.liters||0),0),other=L.filter(l=>l.kind!=='fuel').reduce((s,l)=>s+(+l.amount||0),0);
  return {km:kmv,fuel,lit,other,cost:fuel+other,perKm:kmv?Math.round((fuel+other)/kmv):null,l100:kmv>=150&&lit?Math.round(lit/kmv*1000)/10:null};
}
function fuelFlags(){
  const t=iso(new Date()),f=addDays(t,-29),st=M.vehicles.map(v=>({v,s:vehStats(v.id,f,t)})).filter(x=>x.s.l100);
  if(st.length<3)return [];
  const arr=st.map(x=>x.s.l100).sort((a,b)=>a-b),med=arr[Math.floor((arr.length-1)/2)];
  return st.filter(x=>x.s.l100>med*1.3).map(x=>({plate:x.v.plate,l100:x.s.l100,avg:med}));
}
const nameOf=id=>id==='_'?'بلا سائق':(drv(id)?drv(id).name:'سائق محذوف');
function vehReady(v){if(!v)return false;if(v.status==='maint')return false;const c=D.checks[v.id];return !(c&&!c.ok)}
function routeKm(list){let p=DEPOT,t=0;list.forEach(o=>{const c=AREAS[o.area];if(c){t+=km(p,c);p=c}});t+=km(p,DEPOT);return Math.round(t*1.4)}
function sortStops(list){
  const out=[];let p=DEPOT;
  [list.filter(o=>o.prio),list.filter(o=>!o.prio)].forEach(g=>{
    const known=g.filter(o=>AREAS[o.area]),unk=g.filter(o=>!AREAS[o.area]);
    while(known.length){let bi=0,bd=1e9;known.forEach((o,i)=>{const d=km(p,AREAS[o.area]);if(d<bd){bd=d;bi=i}});const o=known.splice(bi,1)[0];out.push(o);p=AREAS[o.area]}
    out.push(...unk);
  });
  out.forEach((o,i)=>o.seq=i+1);return out;
}
/* التوزيع التلقائي: منطقة السائق أولاً، ثم الأقرب، مع احترام حمولة المركبة */
function autoAssign(){
  const avail=M.drivers.filter(d=>present(d)&&vehReady(veh(d.vehicleId)));
  if(!avail.length)return {n:0,left:D.orders.filter(o=>!o.driverId).length,err:'لا يوجد سائق حاضر بمركبة جاهزة'};
  D.orders.forEach(o=>{if(o.driverId&&o.status==='new'&&!avail.some(d=>d.id===o.driverId))o.driverId=''});
  const todo=D.orders.filter(o=>!o.driverId&&o.status==='new').sort((a,b)=>(b.prio?1:0)-(a.prio?1:0)||(b.cartons||0)-(a.cartons||0));
  let n=0;
  todo.forEach(o=>{
    let best=null,bs=1e9;
    avail.forEach(d=>{
      const cap=+veh(d.vehicleId).cap||0,ld=load(d.id);
      if(cap&&ld+(+o.cartons||0)>cap)return;
      const zones=(d.zones||[]);
      let s;
      if(zones.includes(o.area))s=0;
      else{const pts=zones.concat(ordersOf(d.id).map(x=>x.area)).map(a=>AREAS[a]).filter(Boolean);const c=AREAS[o.area];s=10+(c&&pts.length?Math.min(...pts.map(p=>km(p,c))):15)}
      s+=cap?ld/cap:0;
      if(s<bs){bs=s;best=d}
    });
    if(best){o.driverId=best.id;n++}
  });
  avail.forEach(d=>sortStops(ordersOf(d.id)));
  return {n,left:D.orders.filter(o=>!o.driverId&&o.status==='new').length};
}
function stats(){
  const o=D.orders,done=o.filter(x=>x.status==='done').length,ret=o.filter(x=>x.status==='ret').length,post=o.filter(x=>x.status==='post').length;
  return {total:o.length,done,ret,post,left:o.length-done-ret-post,un:o.filter(x=>!x.driverId&&x.status==='new').length};
}

  });

  });
  M.drivers.forEach(d=>{const cr=ordersOf(d.id).filter(o=>o.by==='driver'&&o.status==='done'&&cashOf(o)<due(o)).reduce((t,o)=>t+due(o)-cashOf(o),0);if(cr>0)a.push({c:0,t:d.name+' سجّل بيعاً آجلاً بقيمة '+money(cr)+'. تأكد من الزبائن قبل اعتماده',go:'cash'})});
  M.drivers.forEach(d=>{const c=cashRow(d.id);if(c.diff>0)a.push({c:1,t:'عجز نقدي عند '+d.name+': '+money(c.diff),go:'cash'})});
  M.drivers.forEach(d=>{const os=ordersOf(d.id).filter(o=>o.status!=='post'),ld=os.filter(o=>o.loaded).length,miss=os.filter(o=>!o.loaded&&o.status==='new').length;if(ld&&miss)a.push({c:0,t:d.name+': '+miss+' طلب لم يُمسح عند التحميل',go:'dispatch'})});
  fuelFlags().forEach(f=>a.push({c:0,t:'استهلاك وقود '+f.plate+' مرتفع: '+f.l100+' ل/100كم (المعتاد في الأسطول '+f.avg+')',go:'vehicles'}));
  if(s.ret)a.push({c:0,t:s.ret+' طلب راجع اليوم، راجع الأسباب مع المبيعات',go:'dispatch'});
  return a.sort((x,y)=>y.c-x.c);
}
function nextStep(){
  const s=stats();
  if(!M.drivers.length||!M.vehicles.length)return {t:'ابدأ بإضافة السائقين والمركبات',b:'فتح الإعداد',go:'setup'};
  if(!s.total)return {t:'لا توجد طلبات لهذا اليوم. الصق قائمة المبيعات أو أضف طلباً.',b:'لصق قائمة الطلبات',act:'paste'};
  if(s.un)return {t:s.un+' طلب ينتظر التوزيع على السائقين',b:'توزيع تلقائي',act:'auto'};
  const used=M.drivers.filter(d=>ordersOf(d.id).length);
  const unchecked=used.filter(d=>{const v=veh(d.vehicleId);return v&&!D.checks[v.id]});
  if(unchecked.length&&curDate===iso(new Date()))return {t:unchecked.length+' مركبة تحتاج فحص الجاهزية قبل الخروج',b:'فحص المركبات',go:'vehicles'};
  const loadMiss=used.filter(d=>{const os=ordersOf(d.id).filter(o=>o.status==='new');return os.some(o=>o.loaded)&&os.some(o=>!o.loaded)});
  if(loadMiss.length&&curDate===iso(new Date()))return {t:'أكمل مسح التحميل: '+loadMiss.map(d=>d.name).join('، '),b:'مسح التحميل',act:'scanload'};
  const unsent=used.filter(d=>!D.sent[d.id]);
  if(unsent.length)return {t:'أرسل خط السير إلى '+unsent.length+' سائق وكشف التحميل للمخزن',b:'فتح التوزيع',go:'dispatch'};
  if(s.left)return {t:'السائقون في الطريق. التحديثات تصلك من روابطهم تلقائياً.',b:'متابعة التسليمات',go:'dispatch'};
  if(used.some(d=>{const c=cashRow(d.id);return c.cash>0&&c.recv==null}))return {t:'اكتملت التسليمات. استلم النقد من السائقين وسجّله.',b:'فتح النقد',go:'cash'};
  return {t:'اكتملت تسليمات اليوم. أرسل التقرير للإدارة.',b:'تقرير اليوم',act:'report'};
}
function perf(id){
  let a=0,d=0,r=0;
  Object.keys(DAYS).forEach(k=>DAYS[k].orders.forEach(o=>{if(o.driverId===id&&o.status!=='post'){a++;if(o.status==='done')d++;if(o.status==='ret')r++}}));
  return {a,d,r,rate:(d+r)?Math.round(d/(d+r)*100):null};
}

function parsePaste(txt){
  let n=0;
  txt.split('\n').forEach(line=>{
    const p=line.split(/[،,\t;|]+/).map(x=>x.trim()).filter(Boolean);if(p.length<2)return;
    const num=x=>+String(x||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'')||0;
    D.orders.push({id:uid(),cust:p[0],area:p[1],cartons:num(p[2]),value:num(p[3]),prio:/مستعجل/.test(line),driverId:'',status:'new',note:''});
    rememberCust(p[0],p[1]);n++;
  });
  return n;
}

    h+='<div class="muted">وقت التوثيق: '+new Date(+p.at).toLocaleTimeString('ar-IQ-u-nu-latn',{hour:'numeric',minute:'2-digit'});

      h+=' · <a href="https://www.google.com/maps?q='+la+','+ln+'" target="_blank" rel="noopener">موقع التسليم</a>'+(dk==null?'':dk>5?' <span class="pill warn">بعيد نحو '+Math.round(dk)+' كم عن '+esc(o.area)+'</span>':' · داخل '+esc(o.area))}

function needQR(){if(window.qrcode)return Promise.resolve();if(!qrLib)qrLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://unpkg.com/qrcode-generator@1.4.4/qrcode.js';sc.integrity='sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k';sc.crossOrigin='anonymous';sc.onload=res;sc.onerror=()=>{qrLib=null;rej()};document.head.appendChild(sc)});return qrLib}
async function printLabels(){
  const used=M.drivers.filter(d=>ordersOf(d.id).some(o=>o.status!=='post'));
  if(!used.length){toast('وزّع الطلبات أولاً');return}
  try{await needQR()}catch(e){toast('تعذّر تحميل مولّد الرموز. تحقق من الإنترنت.');return}
  const svg=t=>{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})};
  let h='';

    h+='<div class="pgrp"><h4>'+esc(d.name)+' · '+(v?esc(v.plate):'بلا مركبة')+' · '+os.length+' طلب · '+load(d.id)+' كرتون · '+curDate+' — يُحمَّل بهذا الترتيب</h4><div class="labels">'+
    os.map(o=>'<div class="lab"><div class="q">'+svg(labelCode(o))+'</div><div class="x"><span class="s">'+(o.seq||'')+'</span><b>'+esc(o.cust)+'</b>'+esc(o.area)+' · '+(o.cartons||0)+' كرتون<br>'+esc(d.name)+(v?' · '+esc(v.plate):'')+'</div></div>').join('')+'</div></div>'});
  $('#printArea').innerHTML=h;
  setTimeout(()=>{try{window.print()}catch(e){toast('الطباعة غير متاحة في هذا المتصفح')}},200);
}
function scanLoad(){
  const act=()=>D.orders.filter(o=>o.driverId&&o.status!=='post');
  openScanner({
    status:()=>'مسح التحميل: '+act().filter(o=>o.loaded).length+' من '+act().length,
    onCode:c=>{
      const p=parseLabel(c);if(!p)return {ok:false,text:'هذا ليس ملصق طلب'};
      if(p.day&&p.day!==curDate)return {ok:false,text:'ملصق يوم آخر ('+p.day+')'};
      const o=D.orders.find(x=>x.id===p.id);if(!o)return {ok:false,text:'الطلب غير موجود في هذا اليوم'};
      if(!o.driverId)return {ok:false,text:o.cust+': بلا سائق. وزّعه أولاً.'};
      if(o.status==='post')return {ok:false,text:o.cust+': مؤجل، لا يُحمَّل اليوم'};
      const d=drv(o.driverId),v=veh(d.vehicleId),mine=()=>ordersOf(d.id).filter(x=>x.status!=='post');
      if(o.loaded)return {ok:true,text:o.cust+': محمّل مسبقاً'+(v?' في '+v.plate:'')};
      o.loaded=true;o.loadedAt=Date.now();saveD();
      return {ok:true,text:o.cust+' ← '+d.name+(v?' · '+v.plate:'')+' ('+mine().filter(x=>x.loaded).length+'/'+mine().length+')'};
    },
    onClose:()=>render()
  });
}

function computeRep(f,t){
  const R={days:[],drv:{},reasons:{},areas:{},n:0,T:{orders:0,done:0,ret:0,post:0,part:0,cartD:0,due:0,cash:0,short:0,pod:0}};
  const row=id=>R.drv[id]||(R.drv[id]={id,orders:0,done:0,ret:0,part:0,cartD:0,due:0,cash:0,short:0,days:{},abs:0});
  for(let d=f;d<=t;d=addDays(d,1)){
    const x=DAYS[d],day={d,done:0,ret:0};R.days.push(day);if(!x||!x.orders.length)continue;R.n++;
    const per={};
    x.orders.forEach(o=>{
      R.T.orders++;if(o.status==='post'){R.T.post++;return}
      const id=o.driverId||'_',r=row(id);r.orders++;r.days[d]=1;
      if(o.status==='done'){
        const c=cashOf(o);r.done++;day.done++;R.T.done++;r.cartD+=dlv(o);R.T.cartD+=dlv(o);r.due+=due(o);R.T.due+=due(o);r.cash+=c;R.T.cash+=c;per[id]=(per[id]||0)+c;if(o.pod)R.T.pod++;
        if(partial(o)){r.part++;R.T.part++;const k=o.reason||'إرجاع جزئي';R.reasons[k]=(R.reasons[k]||0)+1;R.areas[o.area]=(R.areas[o.area]||0)+1}
      }else if(o.status==='ret'){r.ret++;day.ret++;R.T.ret++;const k=o.reason||'بدون سبب';R.reasons[k]=(R.reasons[k]||0)+1;R.areas[o.area]=(R.areas[o.area]||0)+1}
    });
    Object.keys(x.cashIn||{}).forEach(id=>{const df=(per[id]||0)-(+x.cashIn[id]||0);if(df>0){R.T.short+=df;row(id).short+=df}});
    Object.keys(x.att||{}).forEach(id=>{if(x.att[id]==='absent')row(id).abs++});
  }
  R.list=Object.values(R.drv).map(r=>Object.assign(r,{rate:r.done+r.ret?Math.round(r.done/(r.done+r.ret)*100):null})).sort((a,b)=>(b.rate==null?-1:b.rate)-(a.rate==null?-1:a.rate)||b.done-a.done);
  return R;
}

    try{const n=await rpc('sup_rotate',{p_code:KEY,p_which:v});if(!n)throw 0;
      if(v==='drive'){TEAM.drive_code=n;D.sent={};saveD();render();msgSheet('رابط السائقين تغيّر','الروابط القديمة للسائقين توقفت. أرسل خط السير لكل سائق من تبويب التوزيع ليصله رابطه الجديد.')}
      else{KEY=n;try{localStorage.setItem('supKey',n)}catch(err){}render();msgSheet('رابط المشرف الجديد','احفظ هذا الرابط في مكان آمن. الرابط القديم توقف على كل الأجهزة:\n'+location.origin+location.pathname+'#'+n)}
    }catch(err){toast('تعذّر التغيير. تحقق من الإنترنت.')}
    return}
  if(a==='labels'){printLabels();return}
  if(a==='scanload'){if(!D.orders.some(o=>o.driverId)){toast('وزّع الطلبات أولاً');return}scanLoad();return}
  if(a==='flog'){flogSheet(v);return}
  if(a==='flist'){flistSheet(v);return}
  if(a==='flsave'){
    const kind=val('lKind'),amt=+val('lAmt')||0,k=+val('lKm')||0,x=veh(v);
    if(!amt){toast('اكتب المبلغ');return}
    F.logs.push({id:uid(),vid:v,date:val('lDate')||curDate,kind,amount:amt,liters:kind==='fuel'?(+val('lLit')||0):0,km:k,note:val('lNote')});
    if(F.logs.length>3000)F.logs=F.logs.slice(-3000);
    let ch=false;if(k>(+x.km||0)){x.km=k;ch=true}
    if(kind==='oil'&&k){x.oilAt=k+(+M.settings.oilEvery||5000);ch=true}
    if(ch)saveM();saveF();closeSheet();render();toast(kind==='oil'&&k?'التبديل القادم عند '+x.oilAt.toLocaleString('en')+' كم':'تم الحفظ');return}
  if(a==='fldel'){F.logs=F.logs.filter(l=>l.id!==v);saveF();flistSheet(b.dataset.veh);return}
  if(a==='rp'){REP.p=v;render();return}
  if(a==='repshare'){msgSheet('ملخص الفترة',repText());return}
  if(a==='repcsv'){repCsv();return}
  if(a==='spod'){M.settings.requirePod=$('#sPod').checked;saveM();toast(M.settings.requirePod?'الصورة إلزامية الآن':'الصورة اختيارية');return}
  if(a==='soil'){M.settings.oilEvery=+val('sOil')||5000;saveM();toast('تم الحفظ');return}
  if(a==='cashin'){const x=val('ci'+v);if(x==='')delete D.cashIn[v];else D.cashIn[v]=+x;saveD();render();toast('تم الحفظ');return}
  if(a==='day'){const nd=addDays(curDate,+v);try{const x=await loadDay(nd);curDate=nd;D=x;render();pull()}catch(err){toast('لا يوجد اتصال')}return}
  if(a==='auto'){const r=autoAssign();saveD();toast(r.err||('وُزِّع '+r.n+' طلب'+(r.left?'، بقي '+r.left+' بلا سائق (السعة ممتلئة)':'')));if(tab()!=='dispatch')location.hash='dispatch';else render();return}
  if(a==='paste'){sheet('<h3>لصق قائمة الطلبات</h3><div class="muted">كل طلب في سطر: الزبون، المنطقة، الكراتين، المبلغ<br>مثال: أسواق النور، الدورة، 18، 324000</div><textarea id="pasteTxt" aria-label="قائمة الطلبات"></textarea><div class="btns"><button class="btn pri" data-act="pastego">إضافة</button><button class="btn" data-act="close">إغلاق</button></div>');return}
  if(a==='pastego'){const n=parsePaste(val('pasteTxt'));if(!n){toast('لم أجد أي سطر صالح');return}saveD();closeSheet();toast('أُضيف '+n+' طلب');location.hash='dispatch';render();return}
  if(a==='order'){orderSheet(v);return}
  if(a==='osave'){
    const cust=val('oCust'),area=val('oArea');if(!cust||!area){toast('اكتب الزبون والمنطقة');return}
    let o=D.orders.find(x=>x.id===v);if(!o){o={id:uid(),status:'new'};D.orders.push(o)}
    const old=o.driverId;
    Object.assign(o,{cust,area,cartons:+val('oCart')||0,value:+val('oVal')||0,note:val('oNote'),prio:$('#oPrio').checked,driverId:val('oDrv')});
    if(o.driverId&&o.driverId!==old){sortStops(ordersOf(o.driverId));D.sent[o.driverId]=false}
    rememberCust(cust,area);saveD();closeSheet();render();return}
  if(a==='ostat'){const o=D.orders.find(x=>x.id===b.dataset.id);o.status=v;o.by='';o.at=Date.now();if(v==='done'){o.delivered=Math.max(0,Math.min(+val('oDlv')||0,+o.cartons||0))||(+o.cartons||0);o.cash=+val('oCash')||0;o.reason=o.delivered<(+o.cartons||0)?val('oReason'):''}else{o.delivered=null;o.cash=null;o.reason=v==='ret'?val('oReason'):''}saveD();closeSheet();render();return}
  if(a==='odel'){D.orders=D.orders.filter(x=>x.id!==v);saveD();closeSheet();render();return}
  if(a==='route'){const d=drv(v);msgSheet('خط سير '+d.name,routeText(d),d.phone,d.id);return}
  if(a==='loadsheet'){msgSheet('كشف التحميل للمخزن',loadText());return}
  if(a==='report'){msgSheet('تقرير اليوم',reportText());return}
  if(a==='copy'){try{await navigator.clipboard.writeText($('#msgTxt').value);toast('تم النسخ')}catch(err){$('#msgTxt').select();toast('حدّد النص وانسخه يدوياً')}return}
  if(a==='marksent'){D.sent[v]=true;saveD();closeSheet();render();return}
  if(a==='att'){D.att[v]=present(drv(v))?'absent':'present';saveD();render();return}
  if(a==='driver'){driverSheet(v);return}
  if(a==='dsave'){
    const name=val('dName');if(!name){toast('اكتب اسم السائق');return}
    let d=drv(v);if(!d){d={id:uid()};M.drivers.push(d)}
    Object.assign(d,{name,phone:val('dPhone'),vehicleId:val('dVeh'),licenseExp:val('dLic'),zones:val('dZones').split(/[،,]+/).map(x=>x.trim()).filter(Boolean)});
    saveM();closeSheet();render();return}
  if(a==='ddel'){M.drivers=M.drivers.filter(x=>x.id!==v);D.orders.forEach(o=>{if(o.driverId===v)o.driverId=''});saveM();saveD();closeSheet();render();return}
  if(a==='vehicle'){vehicleSheet(v);return}
  if(a==='vsave'){
    const plate=val('vPlate');if(!plate){toast('اكتب رقم اللوحة');return}
    let x=veh(v);if(!x){x={id:uid()};M.vehicles.push(x)}
    Object.assign(x,{plate,type:val('vType'),cap:+val('vCap')||0,km:+val('vKm')||0,oilAt:+val('vOil')||0,regExp:val('vReg'),status:val('vStat')});
    saveM();closeSheet();render();return}
  if(a==='vdel'){M.vehicles=M.vehicles.filter(x=>x.id!==v);M.drivers.forEach(d=>{if(d.vehicleId===v)d.vehicleId=''});saveM();closeSheet();render();return}
  if(a==='check'){checkSheet(v);return}
  if(a==='cksave'){
    const fails=CHECKS.filter((n,i)=>!document.getElementById('ck'+i).checked);
    D.checks[v]={ok:!fails.length,fails,at:Date.now(),km:+val('ckKm')||0};
    const k=+val('ckKm');if(k){veh(v).km=k;saveM()}
    saveD();closeSheet();render();toast(fails.length?'سُجّلت المركبة غير جاهزة':'المركبة جاهزة');return}
  if(a==='saveco'){M.company=val('fCo');saveM();render();toast('تم الحفظ');return}
  if(a==='demo'){const x=demo();M=x.M;curDate=iso(new Date());D=DAYS[curDate]=normDay(x.D);const hs=demoHistory(x.D.orders);F={logs:hs.logs};Object.keys(hs.H).forEach(k=>{DAYS[k]=hs.H[k];persist('days/'+k,hs.H[k])});REP.ready='';saveM();saveD();saveF();location.hash='today';render();toast('حُمّلت البيانات التجريبية');return}
  if(a==='wipe'){
    if(!wipeArmed){wipeArmed=true;b.textContent='اضغط مرة ثانية للتأكيد';setTimeout(()=>{wipeArmed=false;if(tab()==='setup')render()},4000);return}
    wipeArmed=false;try{await loadRange(addDays(iso(new Date()),-92),iso(new Date()))}catch(err){}M={company:'',drivers:[],vehicles:[],customers:[],settings:{}};F={logs:[]};saveF();REP.ready='';Object.keys(DAYS).forEach(k=>{if(DAYS[k].orders.length||k===curDate){DAYS[k]=blankDay();persist('days/'+k,DAYS[k])}});D=DAYS[curDate];saveM();render();toast('مُسحت البيانات');return}
});
window.addEventListener('hashchange',()=>{closeSheet();render()});
init();
</script>
</body>
</html>
